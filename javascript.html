<!DOCTYPE html> 
<html lang="pt-br">
<head>
  <meta charset="utf-8"> 
  <title>O que é HTML?</title> 
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F4F7F6;
      color: #2C3E50;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      border-left: 6px solid #02C4B0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .voltar {
      color: #02C4B0;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }
  </style>
</head> 
<body>

  <!-- Link para voltar para a página inicial -->
  <a href="index.html" class="voltar">⬅ Voltar para o Início</a>

  <div class="card">
    <h1>JavaScript</h1>
    <p>O JavaScript é a linguagem de programação que traz vida e comportamento dinâmico ao site, permitindo criar botões clicáveis, alertas e animações.</p>
  </div>

</body>
</html>
