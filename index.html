<!DOCTYPE html> 
<html lang="pt-br">
<head>
  <meta charset="utf-8"> 
  <title>Página Principal</title> 
  <style>
    body 
    
    {
      font-family: Arial, sans-serif;
      background-color: #F4F7F6;
      color: #2C3E50;
      text-align: center; /* Centraliza tudo na página principal */
      padding-top: 50px;
    }
    
    /* Estilo para transformar os links em botões bonitos */
    .menu-link
     {
      display: inline-block;
      background-color: #02C4B0;
      color: white;
      padding: 15px 30px;
      margin: 10px;
      text-decoration: none; /* Tira o sublinhado padrão dos links */
      border-radius: 8px;
      font-weight: bold;
    }

    /* Efeito quando passa o mouse por cima do link */
    .menu-link:hover 
    {
      background-color: #2C3E50;
    }
  </style>
</head> 
<body>
  <h1>Minha primeira página em HTML</h1>
  <p>Escolha um assunto abaixo:</p>

  <!-- Aqui estão as palavras clicáveis que levam para as outras páginas -->
  <a href="html.html" class="menu-link">HTML</a>
  <a href="css.html" class="menu-link">CSS</a>
  <a href="javascript.html" class="menu-link">JavaScript</a>

</body>
</html>
