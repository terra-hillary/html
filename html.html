HTML
<!DOCTYPE html> 
<html lang="pt-br">
<head>
  <meta charset="utf-8"> 
  <title>O que é HTML?</title> 
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F4F7F6;
      color: #2C3E50;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      border-left: 6px solid #02C4B0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .voltar {
      color: #02C4B0;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }
  </style>
</head> 
<body>

  <!-- Link para voltar para a página inicial -->
  <a href="index.html" class="voltar">⬅ Voltar para o Início</a>

  <div class="card">
    <h1>HTML (Estrutura)</h1>
    <p>O HTML é a linguagem de marcação que constrói a estrutura básica da sua página web, usando "tags" para definir onde ficam textos, links e imagens. Usando a analogia de uma obra.</p>
  </div>

</body>
</html>
